services:
  web:
    build:
      context: .
    command: uv run python -m gunicorn --workers 1 --threads 8 --bind 0.0.0.0:8000 wsgi:app
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-runtime:/app/app/runtime
    depends_on:
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    build:
      context: .
    command: uv run celery -A app.BotWorker:worker_app worker --loglevel=info --pool=prefork
    env_file:
      - .env
    volumes:
      - app-runtime:/app/app/runtime
    depends_on:
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 45s

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  app-runtime: