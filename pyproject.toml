[project]
name = "bomb-party-bot"
version = "1.0.0"
description = "A bot for the game Bomb Party"
readme = "README.md"
authors = [
    { name = "Eric Chen", email = "aivectorec@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-cors>=6.0.1",
    "flask-talisman>=1.1.0",
    "flask-wtf>=1.3.0",
    "mitmproxy>=12.2.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "selenium>=4.46.0",
    "wordfreq>=3.1.1",
    "fake-useragent>=2.2.0",
    "redis>=8.1.0",
    "flask-limiter>=4.1.1",
    "gunicorn>=26.2.0",
]

[tool.uv]
package = false
