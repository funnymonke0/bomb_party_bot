<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bomb Party Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sakura.css/css/sakura.css" type="text/css">
  <link rel="stylesheet" href="https://unpkg.com/sakura.css/css/sakura-dark.css" media="screen and (prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/scheme.css') }}">
</head>
<body>
  <main class="container">
    <h1>Bomb Party Bot</h1>
    <p class="sub">Web launcher for BombParty practice bot</p>

    <section class="card">
      <h2>Connection</h2>
      <div class="grid two">
        <label>Username
          <input id="username" type="text" maxlength="50" placeholder="bot name (optional)">
        </label>
        <label>Room code
          <input id="roomcode" type="text" maxlength="4" placeholder="ABCD" required>
        </label>
<!--        <label>Proxies (optional, one per line)-->
<!--          <textarea id="proxies" rows="3" placeholder="ip:port[:user:pass]"></textarea>-->
<!--        </label>-->
      </div>
    </section>

    <section class="card">
      <h2>Source editing (ie. dictionaries for different languages)</h2>
      <div class="grid one">
        <label>Dictionaries (optional, one per line: word)
          <textarea id="dictionaries" rows="6" placeholder="word"></textarea>
        </label>
        <label>Invalid words (optional, one per line)
          <textarea id="invalid" rows="4" placeholder="outdatedword"></textarea>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>Behavior Settings</h2>
      <div class="grid two">
        <label>selectMode
          <select id="selectMode">
            <option value="common">common</option>
            <option value="sneaky">sneaky</option>
            <option value="regen">regen</option>
            <option value="long">long</option>
            <option value="average">average</option>
            <option value="short">short</option>
          </select>
        </label>
      </div>
      <div class="grid three checks">
        <label><input id="regenIfNeeded" type="checkbox"> regenIfNeeded</label>
        <label><input id="sneakyRegen" type="checkbox"> sneakyRegen</label>
        <label><input id="stockpile" type="checkbox"> stockpile</label>
        <label><input id="greedLong" type="checkbox"> greedLong</label>
        <label><input id="timeConstraint" type="checkbox"> timeConstraint</label>
        <label><input id="cyberbullying" type="checkbox"> cyberbullying</label>
        <label><input id="mistakes" type="checkbox"> mistakes</label>
        <label><input id="burstType" type="checkbox"> burstType</label>
        <label><input id="spamType" type="checkbox"> spamType</label>
        <label><input id="dynamicRate" type="checkbox"> dynamicRate</label>
        <label><input id="dynamicPauses" type="checkbox"> dynamicPauses</label>
        <label><input id="dynamicMistakes" type="checkbox"> dynamicMistakes</label>
      </div>
      <details>
        <summary>Timing and chance values</summary>
        <div class="grid two mt">
          <label>minWait <input id="minWait" type="number" step="0.01"></label>
          <label>maxWait <input id="maxWait" type="number" step="0.01"></label>
          <label>mistakePause <input id="mistakePause" type="number" step="0.01"></label>
          <label>miniPause <input id="miniPause" type="number" step="0.01"></label>
          <label>minWpm <input id="minWpm" type="number" step="1"></label>
          <label>maxWpm <input id="maxWpm" type="number" step="1"></label>
          <label>spamWpm <input id="spamWpm" type="number" step="1"></label>
          <label>burstChance <input id="burstChance" type="number" step="0.01"></label>
          <label>minMistakeChance <input id="minMistakeChance" type="number" step="0.01"></label>
          <label>maxMistakeChance <input id="maxMistakeChance" type="number" step="0.01"></label>
          <label>spamChance <input id="spamChance" type="number" step="0.01"></label>
          <label>jitterPercent <input id="jitterPercent" type="number" step="0.01"></label>
        </div>
      </details>
    </section>

    <section class="actions">
      <button id="launchBtn" type="button">Launch Bot</button>
      <button id="stopBtn" type="button" class="danger">Stop Bot</button>
    </section>

    <pre id="status" aria-live="polite">Loading settings...</pre>
  </main>

  <div id="actionOverlay" class="action-overlay" hidden aria-hidden="true">
    <div class="action-overlay__text">Processing...</div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
